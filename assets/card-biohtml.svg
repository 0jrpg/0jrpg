<g transform="translate(72,0)"><rect width="86" height="24" rx="12" fill="#c4b5fd" fill-opacity=".16" stroke="#c4b5fd" stroke-opacity=".7"/><text x="43" y="16" text-anchor="middle" class="k">bio.html</text></g></g>
<text x="38" y="204" class="u">0jrpg/biohtml ↗</text>
<circle cx="360" cy="62" r="26" fill="url(#av)"/><circle class="ring" cx="360" cy="62" r="32" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 7"/>
<circle cx="360" cy="56" r="8" fill="#fff" fill-opacity=".85"/><path d="M344 76q16-20 32 0z" fill="#fff" fill-opacity=".85"/>
