<svg width="440" height="250" viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2a3a"/><stop offset="1" stop-color="#2a0f33"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="16"/></filter>
<linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient><clipPath id="c"><rect width="440" height="250" rx="20"/></clipPath></defs>
<style>.h{font:800 26px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#fff}.d{font:13px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#cbd5e1}.k{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#e2e8f0}.u{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#7dd3fc}
.a{animation:f1 7s ease-in-out infinite alternate}.b{animation:f2 9s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(220px,30px)}}@keyframes f2{to{transform:translate(-200px,-40px)}}
.l1,.l2,.l3{opacity:0;animation:sl 5s ease-out infinite}.l2{animation-delay:.5s}.l3{animation-delay:1s}
@keyframes sl{0%{opacity:0;transform:translateX(-20px)}15%,85%{opacity:1;transform:none}100%{opacity:0}}
.ring{transform-origin:360px 62px;animation:rt 8s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}</style>
<g clip-path="url(#c)"><rect width="440" height="250" fill="url(#bg)"/>
<g filter="url(#b)"><circle class="a" cx="60" cy="60" r="46" fill="#38bdf8" opacity=".6"/><circle class="b" cx="380" cy="190" r="54" fill="#f472b6" opacity=".5"/></g>
<rect x="18" y="18" width="404" height="214" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".22"/>
