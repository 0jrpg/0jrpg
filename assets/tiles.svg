<style>.th{font:800 17px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#f8fafc}.td{font:13px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#cbd5e1}.ic{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-weight:700}
