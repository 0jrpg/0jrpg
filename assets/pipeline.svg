<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg"><rect id="bgd" width="900" height="140" rx="16" fill="#0b1020"/>
<defs><linearGradient id="pl" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="810" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="3"/></filter></defs>
<style>.pt{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#cbd5e1}.fl{stroke-dasharray:6 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-14}}
.nd{animation:nd 6s ease-in-out infinite}@keyframes nd{0%,20%,100%{transform:scale(1)}8%{transform:scale(1.14)}}
.nd{transform-box:fill-box;transform-origin:center}</style>
<line class="fl" x1="90" y1="66" x2="810" y2="66" stroke="url(#pl)" stroke-width="3" stroke-opacity=".7"/>
<path id="p" d="M90 66 H810" fill="none"/>
<g class="nd" style="animation-delay:0.0s"><circle cx="90" cy="66" r="30" fill="#0b1020" stroke="#7dd3fc" stroke-width="2"/><text x="90" y="75" text-anchor="middle" style="font-size:24px">💡</text></g><text x="90" y="124" text-anchor="middle" class="pt">ideia</text><g class="nd" style="animation-delay:1.2s"><circle cx="270" cy="66" r="30" fill="#0b1020" stroke="#7dd3fc" stroke-width="2"/><text x="270" y="75" text-anchor="middle" style="font-size:24px">⌨️</text></g><text x="270" y="124" text-anchor="middle" class="pt">código</text><g class="nd" style="animation-delay:2.4s"><circle cx="450" cy="66" r="30" fill="#0b1020" stroke="#7dd3fc" stroke-width="2"/><text x="450" y="75" text-anchor="middle" style="font-size:24px">⬆️</text></g><text x="450" y="124" text-anchor="middle" class="pt">git push</text><g class="nd" style="animation-delay:3.5999999999999996s"><circle cx="630" cy="66" r="30" fill="#0b1020" stroke="#7dd3fc" stroke-width="2"/><text x="630" y="75" text-anchor="middle" style="font-size:24px">🔨</text></g><text x="630" y="124" text-anchor="middle" class="pt">build</text><g class="nd" style="animation-delay:4.8s"><circle cx="810" cy="66" r="30" fill="#0b1020" stroke="#7dd3fc" stroke-width="2"/><text x="810" y="75" text-anchor="middle" style="font-size:24px">🌍</text></g><text x="810" y="124" text-anchor="middle" class="pt">no ar</text>
<circle r="7" fill="#fff" filter="url(#gl)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
<circle r="4" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
</svg>