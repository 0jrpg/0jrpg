<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d24"/><stop offset=".55" stop-color="#101a3d"/><stop offset="1" stop-color="#05261c"/></linearGradient>
<linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#6ee7b7"><animate attributeName="stop-color" values="#6ee7b7;#7dd3fc;#fde047;#6ee7b7" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#7dd3fc"><animate attributeName="stop-color" values="#7dd3fc;#fde047;#6ee7b7;#7dd3fc" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter><clipPath id="cp"><rect width="900" height="330" rx="24"/></clipPath></defs>
<style>.h{font:800 46px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-1px}.s{font:500 16px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#d1fae5}.k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#f1f5f9}.u{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#6ee7b7}.cd{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;opacity:0;animation:cd 6s infinite}.t{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#94a3b8;letter-spacing:2px}
@keyframes cd{0%{opacity:0;transform:translateX(-8px)}10%,92%{opacity:1;transform:none}100%{opacity:0}}
.o1{animation:a 13s ease-in-out infinite alternate}.o2{animation:b 16s ease-in-out infinite alternate}
@keyframes a{to{transform:translate(520px,40px)}}@keyframes b{to{transform:translate(-440px,-30px)}}
.fl{stroke-dasharray:6 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-14}}
.btn{animation:bt 2.2s ease-in-out infinite}@keyframes bt{50%{fill-opacity:.9;transform:translateY(-1px)}}
.badge{animation:pb 2.4s ease-in-out infinite}@keyframes pb{50%{opacity:.55}}
.cur{animation:bl2 1s steps(1) infinite}@keyframes bl2{50%{opacity:0}}</style>
<g clip-path="url(#cp)"><rect width="900" height="330" fill="url(#bg)"/>
<g filter="url(#bl)"><circle class="o1" cx="80" cy="260" r="90" fill="#10b981" opacity=".45"/><circle class="o2" cx="820" cy="70" r="90" fill="#6366f1" opacity=".5"/></g>
<rect x="20" y="20" width="860" height="290" rx="20" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".2"/>
<g class="badge"><rect x="46" y="38" width="128" height="26" rx="13" fill="#6ee7b7" fill-opacity=".18" stroke="#6ee7b7"/><text x="110" y="55.5" text-anchor="middle" class="k" style="fill:#a7f3d0">★ EM DESTAQUE</text></g>
<text x="46" y="108" class="h" fill="url(#gr)">Alpha Language</text>
<text x="46" y="134" class="s" style="display:none"></text>
<!-- editor -->
<rect x="46" y="124" width="310" height="150" rx="12" fill="#050816" fill-opacity=".85" stroke="#fff" stroke-opacity=".15"/>
<circle cx="62" cy="138" r="4" fill="#ff5f57"/><circle cx="76" cy="138" r="4" fill="#febc2e"/><circle cx="90" cy="138" r="4" fill="#28c840"/><text x="340" y="141" text-anchor="end" class="t">arquivo.alf</text>
<g transform="translate(0,12)"><text x="62" y="150" class="cd" fill="#7dd3fc" style="animation-delay:0.0s">&lt;janela&gt; #B0C4DE {login}</text><text x="62" y="174" class="cd" fill="#c4b5fd" style="animation-delay:0.5s">*usuario "Usuário"</text><text x="62" y="198" class="cd" fill="#c4b5fd" style="animation-delay:1.0s">*senha "Senha"</text><text x="62" y="222" class="cd" fill="#6ee7b7" style="animation-delay:1.5s">@entrar</text><text x="62" y="246" class="cd" fill="#fdba74" style="animation-delay:2.0s">&amp;mensagem "Bem-vindo ao Alpha"</text></g>
<rect class="cur" x="62" y="262" width="8" height="14" fill="#6ee7b7"/>
<!-- arrow -->
<line class="fl" x1="372" y1="198" x2="452" y2="198" stroke="#6ee7b7" stroke-width="2.5"/><polygon points="452,191 466,198 452,205" fill="#6ee7b7"/>
<text x="412" y="184" text-anchor="middle" class="t">tradutor.py</text>
<!-- output window -->
<rect x="476" y="124" width="200" height="150" rx="12" fill="#B0C4DE" fill-opacity=".92"/>
<rect x="476" y="124" width="200" height="22" rx="12" fill="#1e293b" fill-opacity=".35"/><text x="576" y="139" text-anchor="middle" class="t" style="fill:#0f172a">login</text>
<rect x="496" y="156" width="160" height="22" rx="6" fill="#fff"/><text x="504" y="171" class="t" style="fill:#64748b;letter-spacing:0">Usuário</text>
<rect x="496" y="184" width="160" height="22" rx="6" fill="#fff"/><text x="504" y="199" class="t" style="fill:#64748b;letter-spacing:0">Senha</text>
<rect class="btn" x="496" y="214" width="76" height="22" rx="11" fill="#10b981" fill-opacity=".7"/><text x="534" y="229" text-anchor="middle" class="k">entrar</text>
<text x="496" y="256" class="t" style="fill:#0f172a;letter-spacing:0">Bem-vindo ao Alpha</text>
<!-- right text -->
<text x="710" y="96" class="s" style="font-size:14px">Escreva HTML, JS e Python</text>
<text x="710" y="116" class="s" style="font-size:14px">num só código .alf,</text>
<text x="710" y="136" class="s" style="font-size:14px">em português do Brasil.</text>
<g transform="translate(710,160)"><g transform="translate(0,0)"><rect width="60" height="26" rx="13" fill="#fde047" fill-opacity=".16" stroke="#fde047" stroke-opacity=".7"/><text x="30.0" y="17.5" text-anchor="middle" class="k">Python</text></g><g transform="translate(70,0)"><rect width="50" height="26" rx="13" fill="#fb923c" fill-opacity=".16" stroke="#fb923c" stroke-opacity=".7"/><text x="25.0" y="17.5" text-anchor="middle" class="k">HTML</text></g><g transform="translate(0,36)"><rect width="34" height="26" rx="13" fill="#facc15" fill-opacity=".16" stroke="#facc15" stroke-opacity=".7"/><text x="17.0" y="17.5" text-anchor="middle" class="k">JS</text></g><g transform="translate(44,36)"><rect width="60" height="26" rx="13" fill="#6ee7b7" fill-opacity=".16" stroke="#6ee7b7" stroke-opacity=".7"/><text x="30.0" y="17.5" text-anchor="middle" class="k">.alf</text></g></g>
<text x="710" y="256" class="u">alphalanguage/alf ↗</text>
</g><rect x=".5" y=".5" width="899" height="329" rx="24" fill="none" stroke="#fff" stroke-opacity=".15"/></svg>