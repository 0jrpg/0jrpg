<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07142e"/><stop offset=".6" stop-color="#0d2552"/><stop offset="1" stop-color="#2a1a05"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#fde68a"><animate attributeName="stop-color" values="#fde68a;#93c5fd;#fde68a" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#f59e0b"><animate attributeName="stop-color" values="#f59e0b;#60a5fa;#f59e0b" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect width="900" height="330" rx="24"/></clipPath><clipPath id="in"><rect x="20" y="20" width="860" height="290" rx="20"/></clipPath>
</defs>
<style>
.h{font:800 46px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-1px}.s{font:500 17px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#dbeafe}.k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#f1f5f9}.u{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#fde68a}.t{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;fill:#94a3b8;letter-spacing:3px}
.o1{animation:a 13s ease-in-out infinite alternate}.o2{animation:b 16s ease-in-out infinite alternate}
@keyframes a{to{transform:translate(480px,50px)}}@keyframes b{to{transform:translate(-420px,-40px)}}
.cap{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.tas{animation:sw 3s ease-in-out infinite;transform-origin:742px 118px}@keyframes sw{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.bk1{animation:bb 3.2s ease-in-out infinite}.bk2{animation:bb 3.2s ease-in-out infinite .4s}.bk3{animation:bb 3.2s ease-in-out infinite .8s}
@keyframes bb{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.badge{animation:pb 2.4s ease-in-out infinite}@keyframes pb{50%{opacity:.55}}
.shine{animation:sn 5s linear infinite}@keyframes sn{from{transform:translateX(-300px)}to{transform:translateX(1000px)}}
.sp{animation:tw 2.5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
</style>
<g clip-path="url(#cp)"><rect width="900" height="330" fill="url(#bg)"/>
<g filter="url(#bl)"><circle class="o1" cx="90" cy="70" r="85" fill="#3b82f6" opacity=".55"/><circle class="o2" cx="800" cy="260" r="95" fill="#f59e0b" opacity=".4"/></g>
<rect x="20" y="20" width="860" height="290" rx="20" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".2"/>
<g clip-path="url(#in)"><rect class="shine" x="0" y="0" width="140" height="330" fill="url(#sh)" transform="skewX(-20)"/></g>
<g class="badge"><rect x="46" y="42" width="128" height="26" rx="13" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="110" y="59.5" text-anchor="middle" class="k" style="fill:#fde68a">★ EM DESTAQUE</text></g>
<text x="46" y="122" class="h" fill="url(#gold)">EducaTurdi</text>
<text x="46" y="154" class="s">Um novo jeito de viver o ambiente escolar.</text>
<text x="46" y="178" class="s" style="font-size:14px;fill:#93c5fd">Plataforma moderna e integrada que aproxima pessoas e conhecimento.</text>
<g transform="translate(46,200)"><g transform="translate(0,0)"><rect width="120.8" height="26" rx="13" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24" stroke-opacity=".7"/><text x="60.4" y="17.5" text-anchor="middle" class="k">📚 organização</text></g><g transform="translate(130.8,0)"><rect width="120.8" height="26" rx="13" fill="#60a5fa" fill-opacity=".16" stroke="#60a5fa" stroke-opacity=".7"/><text x="60.4" y="17.5" text-anchor="middle" class="k">⚡ praticidade</text></g><g transform="translate(261.6,0)"><rect width="120.8" height="26" rx="13" fill="#c4b5fd" fill-opacity=".16" stroke="#c4b5fd" stroke-opacity=".7"/><text x="60.4" y="17.5" text-anchor="middle" class="k">🎨 modernidade</text></g><g transform="translate(392.40000000000003,0)"><rect width="90.39999999999999" height="26" rx="13" fill="#6ee7b7" fill-opacity=".16" stroke="#6ee7b7" stroke-opacity=".7"/><text x="45.199999999999996" y="17.5" text-anchor="middle" class="k">🤝 conexão</text></g></g>
<g transform="translate(46,244)"><g transform="translate(0,0)"><rect width="84" height="26" rx="13" fill="#e2e8f0" fill-opacity=".16" stroke="#e2e8f0" stroke-opacity=".7"/><text x="42.0" y="17.5" text-anchor="middle" class="k">Next.js</text></g><g transform="translate(94,0)"><rect width="108" height="26" rx="13" fill="#60a5fa" fill-opacity=".16" stroke="#60a5fa" stroke-opacity=".7"/><text x="54.0" y="17.5" text-anchor="middle" class="k">TypeScript</text></g><g transform="translate(212,0)"><rect width="92" height="26" rx="13" fill="#3ecf8e" fill-opacity=".16" stroke="#3ecf8e" stroke-opacity=".7"/><text x="46.0" y="17.5" text-anchor="middle" class="k">Supabase</text></g><g transform="translate(314,0)"><rect width="108" height="26" rx="13" fill="#93c5fd" fill-opacity=".16" stroke="#93c5fd" stroke-opacity=".7"/><text x="54.0" y="17.5" text-anchor="middle" class="k">PostgreSQL</text></g><g transform="translate(432,0)"><rect width="76" height="26" rx="13" fill="#f8fafc" fill-opacity=".16" stroke="#f8fafc" stroke-opacity=".7"/><text x="38.0" y="17.5" text-anchor="middle" class="k">Vercel</text></g></g>
<text x="46" y="292" class="u">educaturdi.vercel.app ↗</text>
<!-- cap -->
<g class="cap"><polygon points="742,92 812,120 742,148 672,120" fill="#e2e8f0" stroke="#fff" stroke-opacity=".6"/>
<path d="M702 134 v26 q40 24 80 0 v-26 l-40 16z" fill="#93c5fd"/>
<g class="tas"><line x1="742" y1="118" x2="800" y2="124" stroke="#fbbf24" stroke-width="2.5"/><line x1="800" y1="124" x2="800" y2="158" stroke="#fbbf24" stroke-width="2.5"/><circle cx="800" cy="162" r="5" fill="#fbbf24"/></g></g>
<g transform="translate(676,232)"><rect class="bk1" x="0" y="0" width="110" height="16" rx="3" fill="#60a5fa"/><rect class="bk2" x="8" y="-18" width="94" height="16" rx="3" fill="#fbbf24"/><rect class="bk3" x="2" y="-36" width="104" height="16" rx="3" fill="#c4b5fd"/></g>
<text x="854" y="294" text-anchor="end" class="t">SPROKTURDI</text>
<circle class="sp" cx="640" cy="60" r="2" fill="#fff"/><circle class="sp" cx="850" cy="70" r="1.6" fill="#fff" style="animation-delay:.8s"/><circle class="sp" cx="620" cy="200" r="1.4" fill="#fff" style="animation-delay:1.4s"/><circle class="sp" cx="860" cy="200" r="2" fill="#fff" style="animation-delay:2s"/>
</g><rect x=".5" y=".5" width="899" height="329" rx="24" fill="none" stroke="#fff" stroke-opacity=".15"/></svg>